<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>مربی بدنسازی | Workout Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./theme-light.css" />
  <link rel="manifest" href="./manifest.json" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="header-content">
        <h1 class="app-title" id="page-title">داشبورد</h1>
        <div class="header-actions">
          <button class="icon-btn" id="btn-theme" title="تم روشن/تاریک">☀️</button>
          <button class="icon-btn" id="btn-refresh" title="بروزرسانی">↻</button>
          <button class="icon-btn" id="btn-settings-header" title="تنظیمات">⚙</button>
        </div>
      </div>
      <div class="week-progress" id="week-progress-bar">
        <div class="week-fill" id="week-fill"></div>
      </div>
    </header>
    <main class="main-content" id="main-content"></main>
    <nav class="bottom-nav" id="bottom-nav">
      <button class="nav-item active" data-view="dashboard">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">داشبورد</span>
      </button>
      <button class="nav-item" data-view="workouts">
        <span class="nav-icon">💪</span>
        <span class="nav-label">تمرین</span>
      </button>
      <button class="nav-item" data-view="supplements">
        <span class="nav-icon">💊</span>
        <span class="nav-label">مکمل</span>
      </button>
      <button class="nav-item" data-view="progress">
        <span class="nav-icon">📊</span>
        <span class="nav-label">پیشرفت</span>
      </button>
      <button class="nav-item" data-view="more">
        <span class="nav-icon">☰</span>
        <span class="nav-label">بیشتر</span>
      </button>
    </nav>
    <div id="toast" class="toast hidden"></div>
    <div id="modal-root"></div>
  </div>
  <script src="./data.js"></script>
  <script src="./storage.js"></script>
  <script src="./app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
</body>
</html>
